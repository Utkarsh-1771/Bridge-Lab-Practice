<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 class="heading">Internship Application Form</h1>
    </header>
    <section class="main-body">
        <form action="/register" method="post">
            <label for="username">Enter your full name</label>
            <br>
            <input type="text" id="username" name="username" placeholder="Enter username" required>
            <br><br>
            <label for="email">Enter your email</label>
            <br>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <br><br>
            <label for="phone">Enter your phone number</label>
            <br>
            <input type="number" name="phone" id="phone" required>
            <br><br>
            <label for="age">Enter your age</label>
            <br>
            <input type="number" id="age" name="age" value="18" required>
            <br><br>
            <label for="dob">Enter your DOB</label>
            <br>
            <input type="date" name="dob" id="dob" required>
            <br><br>
            <label for="password">Enter the password</label>
            <br>
            <input type="password" name="password" id="password" required>
            <br><br>

            <p>Select your gender</p>
            <input type="radio" name="gender" value="Male" id="Male">
            <label for="Male">Male</label>
            <input type="radio" name="gender" value="Female" id="Female">
            <label for="Female">Female</label>
            <input type="radio" name="gender" value="Other" id="Other">
            <label for="Other">Other</label>
            <br><br>

            <label for="course">Select your course</label>
            <br>
            <select name="course" id="course" required>
                <option value="CSE">CSE</option>
                <option value="IT">IT</option>
                <option value="ECE">ECE</option>
                <option value="Mechanical">Mechanical</option>
            </select>
            <br><br>

            <label for="skills">Select Your skills</label>
            <br>
            <input type="checkbox" name="skills" id="Java">
            <label for="Java">Java</label>
            <input type="checkbox" name="skills" id="JavaScript">
            <label for="JavaScript">JavaScript</label>
            <input type="checkbox" name="skills" id="HTML">
            <label for="HTML">HTML</label>
            <input type="checkbox" name="skills" id="CSS">
            <label for="CSS">CSS</label>
            <input type="checkbox" name="skills" id="React">
            <label for="React">React</label>
            <br><br>

            <p>Select the city for internship</p>
            <input type="radio" name="intern" id="bangalore">
            <label for="bangalore">Bangalore</label>
            <input type="radio" name="intern" id="pune">
            <label for="pune">Pune</label>
            <input type="radio" name="intern" id="hyderabad">
            <label for="hyderabad">Hyderabad</label>
            <input type="radio" name="intern" id="delhi">
            <label for="delhi">Delhi</label>
            <br><br>

            <label for="resume">Upload your resume here</label>
            <br>
            <input type="file" name="resume" id="resume" required>
            <br><br>

            <label for="cover-letter">Enter your cover letter</label>
            <br>
            <textarea name="cover-letter" id="cover-letter" placeholder="Enter your cover letter" required rows="5" cols="50"></textarea>
            <br><br>
            <hr>
            <br>

            <div class="buttons">
                <input type="submit" name="submit" id="submit" value="Register" class="submit">
                <input type="reset" name="reset" id="reset" value="Reset" class="reset">
            </div>

        </form>
    </section>
    <section class="map">
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3535.625517343843!2d77.58982927569436!3d27.605137476241342!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39736d000b437c71%3A0xf7336acc00b9baf0!2sGLA%20University%20Main%20Gate!5e0!3m2!1sen!2sin!4v1787139736937!5m2!1sen!2sin"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section>
</body>

</html>
